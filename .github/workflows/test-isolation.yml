name: Test isolation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test sandbox/isolation.test.cjs sandbox/linking.test.cjs sandbox/protected.test.cjs sandbox/locale.test.cjs sandbox/group.test.cjs sandbox/identity.test.cjs sandbox/auth.test.cjs
