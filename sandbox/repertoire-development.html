<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Repertorio · Desarrollo · Fase 2</title>
<style>body{font:16px system-ui;max-width:900px;margin:40px auto;padding:0 20px;color:#202124}button{font:inherit;margin:8px 8px 8px 0;padding:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f4f4;padding:16px}label{display:block;margin-top:16px}textarea{box-sizing:border-box;width:100%;min-height:160px;font:14px monospace}#status{min-height:24px}</style></head>
<body><h1>Repertorio · DESARROLLO</h1><p>Acceso técnico de fase 2 a la copia. Solo están disponibles Temas y GrupoTemas; grupos de Coles en consulta.</p>
<p>La interfaz funcional llegará en la fase 3.</p><button id="connect">Conectar Google</button><button id="disconnect">Desconectar</button><button id="validate" disabled>Consultar y validar</button>
<p id="status" role="status"></p><pre id="environment">Comprobando el destino…</pre>
<label for="payload">Petición JSON de repertorio</label><textarea id="payload" spellcheck="false">{"action":"catalog"}</textarea><button id="send" disabled>Enviar petición</button><pre id="result"></pre>
<script>
'use strict';
const sessionKey = 'horas-repertoire-development-token';
const target = '1oC7oISLsgDUlNEbx69HmAv04ztLweacmPpZtT6w1Y6k';
const $ = id => document.getElementById(id);
let ready = false, busy = false, expiresAt = 0;
// Token is held in memory only. Never read credentials from the normal app or persist them.
let developmentToken = '';
function controls(){for(const id of ['send','validate']) $(id).disabled = busy || !ready || !developmentToken || Date.now() >= expiresAt;}
async function json(url, options){const r=await fetch(url,options), d=await r.json();if(!r.ok)throw Error(d.error||'Error del servicio');return d;}
async function send(payload){if(busy||!ready||!developmentToken||Date.now()>=expiresAt)throw Error('Conecta Google en desarrollo.');busy=true;controls();try{$('result').textContent=JSON.stringify(await json('/api/repertorio-test',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+developmentToken},body:JSON.stringify(payload)}),null,2);$('status').textContent='Consulta o guardado verificado por el servidor.';}finally{busy=false;controls();}}
$('connect').onclick=async()=>{try{
  const c=await json('/api/repertorio-test?api=oauth');if(c.sessionKey!==sessionKey)throw Error('Sesión de desarrollo no reconocida.');
  if(!window.google?.accounts?.oauth2){await new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='https://accounts.google.com/gsi/client';script.onload=resolve;script.onerror=()=>reject(Error('No se pudo cargar Google'));document.head.append(script);});}
  google.accounts.oauth2.initTokenClient({client_id:c.clientId,scope:c.scopes,include_granted_scopes:false,callback:r=>{const seconds=Number(r.expires_in);if(r.error||typeof r.access_token!=='string'||!r.access_token||!Number.isFinite(seconds)||seconds<=30||!(r.scope||'').split(' ').includes(c.scopes)){developmentToken='';expiresAt=0;controls();$('status').textContent=r.error||'Falta permiso de Sheets o una sesión válida.';return;}developmentToken=r.access_token;expiresAt=Date.now()+(seconds-30)*1000;controls();$('status').textContent='Google conectado solo para este acceso de desarrollo.';},error_callback:()=>{$('status').textContent='Conexión cancelada.';}}).requestAccessToken({prompt:''});
}catch(e){$('status').textContent=e.message;}};
$('disconnect').onclick=()=>{developmentToken='';expiresAt=0;controls();$('result').textContent='';$('status').textContent='Sesión local de desarrollo cerrada.';};
$('validate').onclick=()=>send({action:'validate'}).catch(e=>$('status').textContent=e.message);
$('send').onclick=()=>{try{send(JSON.parse($('payload').value)).catch(e=>$('status').textContent=e.message);}catch(e){$('status').textContent=e.message;}};
json('/api/repertorio-test?api=environment').then(e=>{if(e.mode!=='repertoire-development'||e.spreadsheetId!==target||e.legacyOperationsEnabled!==false||e.calendarAccess!==false)throw Error('Destino no válido.');ready=true;$('environment').textContent=JSON.stringify(e,null,2);controls();}).catch(e=>$('status').textContent=e.message);
</script></body></html>
